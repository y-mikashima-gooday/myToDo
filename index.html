<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyToDo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ToDoリスト</h1>
        
        <div class="input-container">
            <input type="text" id="task-input" placeholder="タスクを入力してください">
            <button id="add-btn" onclick="addTask()">追加</button>
        </div>

        <ul id="task-list"></ul>

        <div class="footer">
            <button id="clear-btn">すべてクリア</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
